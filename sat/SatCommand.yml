openapi: 3.0.3
info:
  title: SatCommand
  description: API do SatCommand
  version: 0.0.1
servers:
  - url: https://api.server.test/v1
paths:
  /api/sat/beat:
    post:
      summary: Request SAT Commands 
      description: Request SAT Commands and return the response of execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/satCommandRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/satCommandResponse'
        '400':
          description: 400 | Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 400 | Bad Request
components:
  schemas:
    environment:
      type: string
      title: env
      description: |
        Defines the execution environment:
         - `test`: Development testing environment.
         - `stage`: Pre-production testing environment.
         - `prod`: Production environment.
      enum:
        - test
        - stage
        - prod
      example: test
    version:
      type: string
      title: version
      description: 'Schema of Version of Parameters File, using a major.minor.patch versioning scheme (Ex.: 2.1.3)'
      pattern: ^\d+\.\d+\.\d+$
      example: 2.0.0
    identitySat:
      type: string
      title: SatID
      description: Schema of SAT ID
      minLength: 1
      maxLength: 64
      pattern: ^SAT\d{21}$
      example: SAT12345678900001823
    serialNumber:
      type: string
      title: SAT Serial Number
      format: uuid
      description: Schema of SAT Serial Number, use the format UUIDv4
      minLength: 32
      maxLength: 36
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89a-bA-B][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
      example: FA59BA20-E176-4597-B211-6F5DE7109D7A
    satCommandRequest:
      type: object
      title: satCommandRequest
      description: 'Schema of Initial Parameters file '
      required:
        - env
        - version
        - appID
        - satSN
      properties:
        env:
          $ref: '#/components/schemas/environment'
        version:
          $ref: '#/components/schemas/version'
        appID:
          $ref: '#/components/schemas/identitySat'
        satSN:
          $ref: '#/components/schemas/serialNumber'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/CommandResult'
    Command:
      type: object
      title: command
      description: Schema the Command
      required:
        - id
        - name
      properties:
        id:
          type: string
          title: id
          description: Command ID with format IDYYYYMMDDHHMMSS
          example: 'ID20200101000000'
        name:
          type: string
          title: type
          description: Command name
          example: 'COMMAND_008'
        code:
          type: string
          title: code
          description: 'the code of Alert. When the "name" is equal "COMMAND_008"'
          example: '999'
        message:
          type: string
          title: Alert message
          description: Alert Message
          example: 'lorem ipsum dolor sit amet' 
    CommandResult:
      type: object
      title: command
      description: Schema of Result of execution of the Command
      properties:
        id:
          type: string
          title: id
          description: Command ID with format IDYYYYMMDDHHMMSS
          example: 'ID20200101000000'
        cmd:
          $ref: '#/components/schemas/cmd'
    cmd:
      type: boolean
      title: cmd
      description: Schema of command
      example: true
    satCommandResponse:
      type: object
      title: satCommandResponse
      description: 'Schema of Initial Parameters file '
      required:
        - env
        - version
        - appID
        - satSN
        - appCmd
        - satCmd
      properties:
        env:
          $ref: '#/components/schemas/environment'
        version:
          $ref: '#/components/schemas/version'
        appID:
          $ref: '#/components/schemas/identitySat'
        satSN:
          $ref: '#/components/schemas/serialNumber'
        appCmd:
          $ref: '#/components/schemas/cmd'
        satCmd:
          $ref: '#/components/schemas/cmd'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/Command'
